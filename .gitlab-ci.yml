# ==============================================================================
# GitLab CI - Week 05 Lab
# Lint and test the network-monitoring-automation project.
# ==============================================================================

stages:
  - lint
  - test

default:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv/
  before_script:
    - uv sync --frozen

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

ruff:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

pytest:
  stage: test
  script:
    - uv run pytest
