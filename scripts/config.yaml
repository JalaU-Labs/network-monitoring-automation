# ==============================================================================
# Monitoring configuration - Activity 2
# All durations are expressed in seconds unless noted otherwise.
#
# Host addresses map to the Docker topology defined in docker-compose.yml:
#   172.28.0.10  target-alpha   (netem: 50 ms delay, 5% loss)
#   172.28.0.11  target-beta    (netem: 10 ms delay)
#   172.28.0.2   iperf3-server  (Activity 1)
#   1.1.1.1      public DNS     (external baseline)
# ==============================================================================

monitoring:
  # Time between consecutive probe rounds.
  interval_seconds: 5
  # Total number of probe rounds per host.
  iterations: 10
  # Per-probe timeout before the host is considered unreachable.
  timeout_seconds: 2

# Hosts to monitor. `role` categorizes the destination and is used
# for reporting and future filtering.
hosts:
  - name: target-alpha
    address: 172.28.0.10
    role: container
  - name: target-beta
    address: 172.28.0.11
    role: container
  - name: cloudflare-dns
    address: 1.1.1.1
    role: public

output:
  # Directory where consolidated reports are written (relative to repo root).
  reports_dir: reports
  # Enabled output formats. Supported: json, log, markdown.
  formats:
    - json
    - log
    - markdown
